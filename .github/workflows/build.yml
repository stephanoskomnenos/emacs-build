name: Build and verify Emacs nox
on:
  workflow_dispatch:
    inputs:
      emacs_ref:
        description: Upstream branch, tag or full commit
        type: string
        default: master
      cspgo:
        description: Add context-sensitive PGO training
        type: boolean
        default: true
  schedule:
    # Monday 01:23 Asia/Shanghai (Sunday 17:23 UTC).
    - cron: '23 17 * * 0'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FINAL_STAGE: ${{ (github.event_name == 'schedule' || inputs.cspgo) && 'cs-use' || 'use' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Verify runner supports x86-64-v3
        run: |
          /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
          echo "JOBS=$(nproc)" >> "$GITHUB_ENV"
      - name: Resolve and lock Emacs master
        env:
          EMACS_REF: ${{ inputs.emacs_ref || 'master' }}
        run: |
          python3 scripts/update-master.py --ref "$EMACS_REF"
      - name: Fetch locked sources and fixtures
        run: |
          python3 scripts/fetch.py
          python3 scripts/fetch.py --tests
          python3 scripts/fetch.py --benchmarks --lock
      - name: Build Clang image
        id: toolchain
        run: |
          bash scripts/linux/container.sh image
          identity=$(podman run --rm -v "$PWD:/work:Z" -w /work localhost/emacs-builder:clang23 python3 scripts/linux/dependencies.py)
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: build/dependencies
          key: linux-deps-v4-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}
      - name: Build instrumented Emacs with Clang and ThinLTO
        run: PGO=generate bash scripts/linux/container.sh build
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: build/dependencies
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Train on generic terminal workflows and ELPA benchmarks
        timeout-minutes: 25
        run: bash scripts/linux/container.sh train generate
      - name: Build context-sensitive instrumentation
        if: github.event_name == 'schedule' || inputs.cspgo
        run: PGO=cs-generate bash scripts/linux/container.sh build
      - name: Train context-sensitive profile
        if: github.event_name == 'schedule' || inputs.cspgo
        timeout-minutes: 25
        run: bash scripts/linux/container.sh train cs-generate
      - name: Build optimized Emacs
        env:
          PGO: ${{ env.FINAL_STAGE }}
        run: bash scripts/linux/container.sh build
      - name: Verify in builder and clean Debian 13
        run: bash scripts/linux/container.sh test "$FINAL_STAGE"
      - name: Package binary
        run: bash scripts/linux/container.sh package "$FINAL_STAGE"
      - name: Package RPM
        run: bash scripts/linux/container.sh rpm "$FINAL_STAGE"
      - name: Verify RPM replaces Fedora Emacs and can be removed
        run: bash scripts/linux/container.sh test-rpm
      - uses: actions/upload-artifact@v4
        with:
          name: emacs-nox-rpm-x86-64-v3
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*.rpm
            dist/*.rpm.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: emacs-nox-tar-x86-64-v3
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*-linux-x86-64-v3.tar.zst
            dist/*-linux-x86-64-v3.tar.zst.sha256
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-logs
          path: |
            build/acceptance/*.log
            build/pgo-training-cs/*.log
            build/pgo-training-cs/*/terminal.log
            build/pgo-training/*.log
            build/pgo-training/*/terminal.log
            build/interactive-validation/*/terminal.log
            build/*/logs/*.log
            build/dependencies/*/logs/*.log
