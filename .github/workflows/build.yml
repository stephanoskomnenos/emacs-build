name: Build and verify Emacs nox
on:
  workflow_dispatch:
  schedule:
    # Monday 01:23 Asia/Shanghai (Sunday 17:23 UTC).
    - cron: '23 17 * * 0'
  push:
    paths: ['scripts/**', 'benchmarks/**', 'containers/**', 'tests/**', 'packaging/**', '*sources.json', '.github/workflows/build.yml']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Verify runner supports x86-64-v3
        run: |
          /lib64/ld-linux-x86-64.so.2 --help | grep -F 'x86-64-v3 (supported, searched)'
      - name: Resolve and lock Emacs master
        run: python3 scripts/update-master.py
      - name: Fetch locked sources and fixtures
        run: |
          python3 scripts/fetch.py
          python3 scripts/fetch.py --tests
          python3 scripts/fetch.py --toolchain
          python3 scripts/fetch.py --benchmarks
      - name: Build instrumented Emacs with Clang and ThinLTO
        run: |
          bash scripts/container.sh image
          JOBS=2 PGO=generate bash scripts/container.sh build
      - name: Train on generic terminal workflows and ELPA benchmarks
        run: bash scripts/container.sh train
      - name: Build with the fresh PGO profile
        run: JOBS=2 PGO=use bash scripts/container.sh build
      - name: Verify in builder and clean Debian 13
        run: bash scripts/container.sh test
      - name: Verify real input, asynchronous output and Magit workflows
        run: bash scripts/container.sh test-interactive
      - name: Package binary and sources
        run: bash scripts/container.sh package
      - name: Package RPM
        run: bash scripts/container.sh rpm
      - name: Verify RPM replaces Fedora Emacs and can be removed
        run: bash scripts/container.sh test-rpm
      - uses: actions/upload-artifact@v4
        with:
          name: emacs-nox-rpm-x86-64-v3
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*.rpm
            dist/*.rpm.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: emacs-nox-tar-x86-64-v3
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*-linux-x86-64-v3.tar.zst
            dist/*-linux-x86-64-v3.tar.zst.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: emacs-nox-sources
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/*-sources.tar.zst
            dist/*-sources.tar.zst.sha256
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-logs
          path: |
            build/acceptance/*.log
            build/pgo-training/*.log
            build/pgo-training/*/terminal.log
            build/interactive-validation/*/terminal.log
            build/*/logs/*.log
