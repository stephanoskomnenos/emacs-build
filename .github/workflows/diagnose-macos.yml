name: Diagnose macOS Nettle
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: cache/llvm
          key: macos-llvm-arm64-${{ hashFiles('scripts/macos/llvm.json') }}
      - run: python3 scripts/macos/setup-llvm.py
      - shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, hashlib, tarfile
          s=json.load(open('sources.json'))['nettle']
          urllib.request.urlretrieve(s['url'], '/tmp/nettle.tar')
          assert hashlib.sha256(open('/tmp/nettle.tar','rb').read()).hexdigest()==s['sha256']
          with tarfile.open('/tmp/nettle.tar') as t: t.extractall('/tmp/nettle-source', filter='data')
          PY
          settings=$(python3 scripts/macos/pgo.py)
          eval "$settings"
          export CC_FOR_BUILD="$CC $CPPFLAGS ${CFLAGS/ -flto=thin/} ${LDFLAGS/ -flto=thin/}"
          cd /tmp/nettle-source/nettle-*
          ./configure --disable-shared --disable-public-key --disable-documentation --disable-openssl
          make -j3 > build.log 2>&1 || tail -50 build.log
          "$NM" libnettle.a > symbols.txt
          "$EMACS_LLVM_ROOT/bin/llvm-dis" salsa20-crypt.o -o salsa20-crypt.ll
          cat salsa20-crypt.ll
          grep 'salsa20_crypt' symbols.txt
          "$EMACS_LLVM_ROOT/bin/llvm-dis" non-nettle.o -o non-nettle.ll
          make -C examples nettle-benchmark LDFLAGS="$LDFLAGS -Wl,-save-temps" > saved.log 2>&1 || tail -30 saved.log
          python3 - <<'PYTHON'
          import pathlib, subprocess, os
          for path in pathlib.Path('.').rglob('*salsa20*bc'):
              subprocess.run([os.environ['EMACS_LLVM_ROOT']+'/bin/llvm-dis', str(path), '-o', str(path)+'.ll'], check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nettle-diagnostic
          path: |
            /tmp/nettle-source/**/config.log
            /tmp/nettle-source/**/config.h
            /tmp/nettle-source/**/*.log
            /tmp/nettle-source/**/symbols.txt
            /tmp/nettle-source/**/*.ll
            /tmp/nettle-source/**/*.a
            /tmp/nettle-source/**/*.resolution.txt
