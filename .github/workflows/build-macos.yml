name: Build macOS Emacs
on:
  workflow_dispatch:
    inputs:
      emacs_ref:
        description: Upstream branch, tag or full commit
        type: string
        default: master
      cspgo:
        description: Use CSPGO; disable for ordinary PGO
        type: boolean
        default: true
      compare:
        description: Compare PGO against no-PGO, or CSPGO against ordinary PGO
        type: boolean
        default: false
  schedule:
    # Monday 01:23 Asia/Shanghai.
    - cron: '23 17 * * 0'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      EMACS_BUILD_ROOT: /tmp/emacs-build
      FINAL_STAGE: ${{ (github.event_name == 'schedule' || inputs.cspgo) && 'cs-use' || 'use' }}
      BASELINE_STAGE: ${{ (github.event_name == 'schedule' || inputs.cspgo) && 'use' || 'off' }}
    steps:
      - uses: actions/checkout@v4
      - name: Lock master and fetch training fixtures
        id: sources
        env:
          EMACS_REF: ${{ inputs.emacs_ref || 'master' }}
        run: |
          echo "JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"
          python3 scripts/update-master.py --ref "$EMACS_REF"
          python3 scripts/fetch.py --benchmarks --lock
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import hashlib, json, sys
          sys.path.insert(0, 'scripts')
          from sources import load_sources
          print('dependencies=' + hashlib.sha256(json.dumps(load_sources('macos'), sort_keys=True).encode()).hexdigest())
          PYTHON
      - uses: actions/cache/restore@v4
        id: llvm-cache
        with:
          path: cache/llvm
          key: macos-llvm-arm64-${{ hashFiles('scripts/macos/llvm.json') }}
      - name: Install prebuilt LLVM
        run: python3 scripts/macos/setup-llvm.py
      - uses: actions/cache/save@v4
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        with:
          path: cache/llvm
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Remove Homebrew from disposable runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh -o "$RUNNER_TEMP/uninstall.sh"
          sudo env NONINTERACTIVE=1 /bin/bash "$RUNNER_TEMP/uninstall.sh"
          sudo rm -rf /opt/homebrew
          # Persist a clean PATH across steps, including Python from Xcode.
          echo 'PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin' >> "$GITHUB_ENV"
      - name: Verify selected Clang ThinLTO and PGO
        id: toolchain
        env:
          CSPGO: ${{ (github.event_name == 'schedule' || inputs.cspgo) && '1' || '0' }}
        run: |
          if [ "$CSPGO" = 1 ]; then
            python3 scripts/macos/toolchain.py --cspgo
          else
            python3 scripts/macos/toolchain.py
          fi
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: build/macos/dependencies.tar
          key: macos-deps-v2-${{ steps.toolchain.outputs.identity }}-${{ steps.sources.outputs.dependencies }}-${{ hashFiles('scripts/macos/dependencies.sh', 'scripts/macos/dependency-cache.py', 'scripts/macos/pgo.py', 'scripts/sources.py') }}
      - name: Install static dependencies
        env:
          CACHE_HIT: ${{ steps.dependencies.outputs.cache-hit }}
        run: python3 scripts/macos/dependency-cache.py
      - uses: actions/cache/save@v4
        if: steps.dependencies.outputs.cache-hit != 'true'
        with:
          path: build/macos/dependencies.tar
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Build instrumented Cocoa Emacs
        run: python3 scripts/macos/build.py generate
      - name: Install Pexpect
        run: |
          python3 -m venv "$RUNNER_TEMP/emacs-python"
          "$RUNNER_TEMP/emacs-python/bin/pip" install -r requirements.txt
          echo "$RUNNER_TEMP/emacs-python/bin" >> "$GITHUB_PATH"
      - name: Train generic PTY and GUI workloads
        timeout-minutes: 25
        env:
          EMACS_TRAIN_GUI: '1'
        run: python3 scripts/pgo-train.py /tmp/emacs-build/generate/bundle
      - name: Build context-sensitive instrumentation
        if: github.event_name == 'schedule' || inputs.cspgo == true
        run: python3 scripts/macos/build.py cs-generate
      - name: Train context-sensitive PTY and GUI profile
        if: github.event_name == 'schedule' || inputs.cspgo == true
        timeout-minutes: 25
        env:
          EMACS_TRAIN_GUI: '1'
        run: python3 scripts/pgo-train.py /tmp/emacs-build/cs-generate/bundle
      - name: Build optimized Cocoa Emacs
        run: python3 scripts/macos/build.py "$FINAL_STAGE"
      - name: Audit system-only dynamic dependencies and exercise GUI
        run: |
          python3 scripts/macos/audit.py "/tmp/emacs-build/$FINAL_STAGE/bundle"/Emacs.app > /tmp/emacs-build/link-audit.json
          python3 scripts/macos/gui.py smoke "/tmp/emacs-build/$FINAL_STAGE/bundle"
      - name: Build matched baseline
        if: inputs.compare == true
        run: python3 scripts/macos/build.py "$BASELINE_STAGE"
      - name: Compare baseline and PGO
        if: inputs.compare == true
        run: python3 scripts/macos/gui.py compare "/tmp/emacs-build/$FINAL_STAGE/bundle" --baseline "/tmp/emacs-build/$BASELINE_STAGE/bundle"
      - name: Package app
        run: |
          mkdir -p dist/macos
          cp "/tmp/emacs-build/$FINAL_STAGE/bundle"/BUILD-INFO.json dist/macos/
          cp /tmp/emacs-build/link-audit.json dist/macos/
          cp /tmp/emacs-build/pgo-training/provenance.json dist/macos/
          if [ "$FINAL_STAGE" = cs-use ]; then
            cp /tmp/emacs-build/pgo-training-cs/provenance.json dist/macos/cs-provenance.json
          fi
          tar -C "/tmp/emacs-build/$FINAL_STAGE/bundle" -Jcf dist/macos/Emacs-macos-arm64.tar.xz Emacs.app
          cd dist/macos
          shasum -a 256 Emacs-macos-arm64.tar.xz > Emacs-macos-arm64.tar.xz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Emacs-macos-arm64
          compression-level: 0
          if-no-files-found: error
          path: dist/macos/Emacs-*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-build-report
          path: |
            build/macos/dependencies/**/config.log
            dist/macos/*.json
            /tmp/emacs-build/comparison.json
            /tmp/emacs-build/toolchain/result.json
            /tmp/emacs-build/toolchain/driver-link.txt
            /tmp/emacs-build/toolchain/cs-link.log
            /tmp/emacs-build/pgo-training*/gui-profile.txt
            /tmp/emacs-build/*/build.log
            /tmp/emacs-build/pgo-training*/provenance.json
            /tmp/emacs-build/pgo-training*/profile-summary.txt
            /tmp/emacs-build/pgo-training*/*/terminal.log
            /tmp/emacs-build/pgo-training*/training-benchmarks.log
            /tmp/emacs-build/workload-packages/*/compile.log
            /tmp/emacs-build/gui-*/*/*.json
            /tmp/emacs-build/gui-*/*/emacs.log
